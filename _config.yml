title: Vadim Tiganov
email: tiganoviv@gmail.com
description: >-
  Notes on ML engineering – ranking, recommender systems, search, NLP
  and LLM/agentic systems.
url: "https://tiganoviv.github.io"
baseurl: "/blog"
github_username: tiganoviv

theme: minima
logo: /assets/og-image.png
show_excerpts: true

contacts:
  - { label: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/tiganoviv/" }
  - { label: Email, icon: email, url: "mailto:tiganoviv@gmail.com" }
  - { label: WhatsApp, icon: whatsapp, url: "https://wa.me/4407925203294" }
  - { label: GitHub, icon: github, url: "https://github.com/tiganoviv" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-archives

# Posts per page on the home page.
pagination:
  enabled: true
  per_page: 5
  permalink: /page/:num/
  sort_reverse: true

# One page per tag, at /blog/tags/<tag>/.
jekyll-archives:
  enabled:
    - tags
  layout: tag-archive
  permalinks:
    tag: /tags/:name/

minima:
  skin: classic
  date_format: "%b %-d, %Y"

header_pages:
  - tags.md
  - about.md

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
