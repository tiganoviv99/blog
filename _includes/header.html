<header class="site-header" role="banner">
  <div class="wrapper site-header-inner">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }} <span class="site-title-suffix">blog</span></a>

    <nav class="site-contacts" aria-label="Contacts">
      {%- for item in site.contacts -%}
        <a class="contact-link" href="{{ item.url }}" aria-label="{{ item.label }}" title="{{ item.label }}">
          <svg class="contact-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
            {%- include contact-icon.html icon=item.icon -%}
          </svg>
        </a>
      {%- endfor -%}
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title -%}
          <a class="page-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
